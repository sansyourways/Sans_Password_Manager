name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Developer Certificate of Origin sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./tests/dco-check.sh "$BASE_SHA" "$HEAD_SHA"
