name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true

permissions:
  contents: write
  # Build provenance: id-token mints the OIDC token that identifies this
  # workflow to Sigstore, attestations writes the signed statement back to the
  # repository. Without both, the attest step fails at tag time rather than at
  # review time, which is the worst place to find out.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg openssl shellcheck unzip zip

      - name: Verify source and release version
        run: |
          # The suite is invoked as ./tests/regression.sh below, so a commit
          # whose executable bit was lost fails this job *after* the tag is
          # already public -- leaving a tag with no release, which is worse
          # than not tagging. ci.yml already chmods for exactly this reason;
          # this job did not, and 2.11.0 is a real commit it would have failed
          # on. Restore the bits rather than trusting the tree's modes.
          chmod +x spm.sh install.sh build.sh tests/regression.sh tests/dco-check.sh \
            browser-extension-universal/build.sh browser-extension-universal/install-host.sh \
            browser-extension-universal/setup.sh browser-extension-universal/extension-id.sh \
            browser-extension-universal/native_host.py tests/native_host_protocol.py \
            release-archive.sh
          # The tagged spm.sh must be what src/ produces. A tag whose shipped
          # script does not match its own sources is unauditable, and this is
          # the last point at which that can still be caught.
          ./build.sh --check
          bash -n spm.sh install.sh build.sh release-archive.sh \
            tests/regression.sh tests/dco-check.sh \
            browser-extension-universal/build.sh browser-extension-universal/install-host.sh \
            browser-extension-universal/setup.sh browser-extension-universal/extension-id.sh
          shellcheck -x -S warning spm.sh install.sh build.sh release-archive.sh \
            tests/regression.sh tests/dco-check.sh \
            browser-extension-universal/build.sh browser-extension-universal/install-host.sh \
            browser-extension-universal/setup.sh browser-extension-universal/extension-id.sh
          python3 -m compileall -q browser-extension-universal/native_host.py \
            tests/native_host_protocol.py
          ./tests/regression.sh
          version="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' spm.sh)"
          tag_version="${RELEASE_TAG#v}"
          test "$version" = "$tag_version"
          grep -q "## \[$version\]" CHANGELOG.md
          grep -q '"version": "'"$version"'"' browser-extension/manifest.json
          grep -q '"version": "'"$version"'"' browser-extension-universal/manifest.chromium.json
          grep -q '"version": "'"$version"'"' browser-extension-universal/manifest.firefox.json

      - name: Build and verify release archive
        run: |
          version="${RELEASE_TAG#v}"
          # The archive is built by a script the suite also runs, so the thing
          # that produces a release is the thing that was tested, and it is
          # deterministic: the same tag rebuilt anywhere gives the same bytes.
          archive="$(./release-archive.sh "$version")"
          first="$(sha256sum "$archive" | cut -d" " -f1)"
          ./release-archive.sh "$version" > /dev/null
          second="$(sha256sum "$archive" | cut -d" " -f1)"
          if [ "$first" != "$second" ]; then
            echo "The release archive is not reproducible: $first vs $second" >&2
            exit 1
          fi
          unzip -t "$archive"
          sha256sum -c "$archive.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # spm.sh is attested alongside the archive because that is the file
          # people actually run; someone who copied it out of a release can
          # verify it without keeping the zip.
          subject-path: |
            Sans_Password_Manager_v*.zip
            spm.sh

      - name: Publish immutable GitHub release
        run: |
          version="${RELEASE_TAG#v}"
          archive="Sans_Password_Manager_v${version}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          notes="docs/releases/${version}.md"
          if test -f "$notes"; then
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --verify-tag --title "Sans Password Manager $version" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --verify-tag --title "Sans Password Manager $version" \
              --generate-notes
          fi

      - name: Verify published assets
        run: |
          version="${RELEASE_TAG#v}"
          archive="Sans_Password_Manager_v${version}.zip"
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$verify_dir" \
            --pattern "$archive*"
          (cd "$verify_dir" && sha256sum -c "$archive.sha256" && unzip -t "$archive")
          # The checksum beside a download proves only that the transfer was
          # intact; anyone who can write to the release can write both files.
          # This asks Sigstore whether the archive really came from this
          # workflow in this repository, against the asset as published.
          gh attestation verify "$verify_dir/$archive" --repo "$GITHUB_REPOSITORY"
