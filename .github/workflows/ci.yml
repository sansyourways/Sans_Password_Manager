name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          # The whitespace gate needs a real base commit to diff against. The
          # default shallow clone fetches one commit, which is what silently
          # reduced that check to a diff of HEAD against itself.
          fetch-depth: 0

      - name: Install system test dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y curl gnupg openssl shellcheck unzip zip
          else
            brew install coreutils gnupg shellcheck
          fi

      - name: Generated script is current
        run: |
          # spm.sh is built from src/. A hand-edit there would be silently
          # reverted by the next build, so refuse the PR instead.
          ./build.sh --check

      - name: Static checks
        run: |
          bash -n spm.sh install.sh build.sh tests/regression.sh tests/dco-check.sh \
            browser-extension-universal/build.sh browser-extension-universal/install-host.sh \
            browser-extension-universal/setup.sh browser-extension-universal/extension-id.sh
          shellcheck -x -S warning spm.sh install.sh build.sh \
            tests/regression.sh tests/dco-check.sh \
            browser-extension-universal/build.sh browser-extension-universal/install-host.sh \
            browser-extension-universal/setup.sh browser-extension-universal/extension-id.sh
          # The trusted core and the dashboard are Python that ships inside a
          # shell script. Compile them as themselves, so a syntax error cannot
          # reach a release disguised as a valid shell heredoc.
          python3 -m compileall -q src/spm_core.py src/spm_web_server.py \
            tests/core-test.py browser-extension-universal/native_host.py \
            tests/native_host_protocol.py
          # Whitespace errors in the lines this change actually adds.
          #
          # This used to diff the repo's root commit against HEAD, but the
          # checkout was shallow: `git rev-list --max-parents=0 HEAD` found no
          # parentless commit other than HEAD itself, so the gate compared HEAD
          # to HEAD and passed unconditionally. It never once ran.
          #
          # Scope it to the change instead of the whole tree. Older files carry
          # a backlog of trailing whitespace (markdown hard line breaks, mostly)
          # that is not any one PR's to clean up, and a gate that fails on
          # unrelated history is a gate people learn to ignore.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="HEAD^"
          fi
          if git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            # Three-dot: what this branch added, ignoring what the base moved on to.
            git diff --check "$base"...HEAD
          else
            printf 'No base commit available; skipping the whitespace gate.\n'
          fi

      - name: Disposable-vault regression suite
        run: |
          chmod +x tests/regression.sh
          ./tests/regression.sh

      - name: Release metadata consistency
        run: |
          version="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' spm.sh)"
          test -n "$version"
          grep -q '"version": "'"$version"'"' browser-extension/manifest.json
          grep -q '"version": "'"$version"'"' browser-extension-universal/manifest.chromium.json
          grep -q '"version": "'"$version"'"' browser-extension-universal/manifest.firefox.json
          # The extension ID is derived from the manifest key, but the READMEs
          # quote it as a literal. A key rotation that left the docs behind
          # would send people to register a host for an ID no browser assigns.
          chmod +x browser-extension-universal/extension-id.sh
          extension_id="$(./browser-extension-universal/extension-id.sh)"
          grep -q "$extension_id" browser-extension-universal/README.md
          grep -q "$extension_id" tests/regression.sh

  termux:
    name: termux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build the Termux package on the runner
        run: |
          # Built here, installed in the container. That is the real shape of
          # it -- a .deb is produced on a build machine and installed on the
          # device -- and the Termux image has neither ar nor GNU tar, so
          # building inside it was never going to work.
          version="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' spm.sh)"
          chmod +x packaging/termux/build-deb.sh
          mkdir -p dist
          ./packaging/termux/build-deb.sh "$version" dist
          ls -l "dist/spm_${version}_all.deb"

      - name: Run compatibility checks in the official Termux container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            termux/termux-docker@sha256:823c1f4c0b844f6f9f21e634d4e40b6fcc10dcf7309745c4d7de3add9b1a3fd2 \
            bash -lc '
              set -euo pipefail
              cp -R /workspace "$HOME/spm"
              cd "$HOME/spm"
              bash -n spm.sh install.sh tests/regression.sh tests/dco-check.sh
              bash spm.sh help > "$PREFIX/tmp/spm-help.txt"
              grep -q "Sans Password Manager" "$PREFIX/tmp/spm-help.txt"
              version="$(sed -n "s/^VERSION=\"\\([^\"]*\\)\"/\\1/p" spm.sh)"
              bash install.sh --version "$version" \
                --prefix "$HOME/.local" --dry-run > "$PREFIX/tmp/spm-install.txt"
              grep -q "Dry run complete" "$PREFIX/tmp/spm-install.txt"
              # The package is checked by installing it, not by inspecting
              # it. A .deb that unpacks and a .deb the package manager accepts
              # are different claims, and only the second one matters here.
              #
              # Through apt rather than `dpkg -i`, because the declared
              # dependencies are the point: the bare image has neither gnupg
              # nor python, dpkg refuses to configure without them, and that
              # refusal is correct. apt resolves them the way `pkg install`
              # would on a device.
              apt-get update -qq
              apt-get install -y -qq "/workspace/dist/spm_${version}_all.deb"
              command -v spm
              [ "$(spm --version)" = "$version" ]
              # Avoid grep -q on a live pipe under pipefail: after its first
              # match grep closes the pipe, and the still-writing CLI exits
              # on SIGPIPE (141) even though the package works correctly.
              spm help > "$PREFIX/tmp/packaged-spm-help.txt"
              grep -q "Sans Password Manager" "$PREFIX/tmp/packaged-spm-help.txt"
              # Configured, not merely unpacked: an unconfigured package is
              # exactly what the previous run produced and it looked installed.
              [ "$(dpkg-query -W -f='"'"'${Status}'"'"' spm)" = "install ok installed" ]
              apt-get remove -y -qq spm
            '
