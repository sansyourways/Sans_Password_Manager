name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install system test dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y curl gnupg openssl shellcheck unzip zip
          else
            brew install coreutils gnupg shellcheck
          fi

      - name: Static checks
        run: |
          bash -n spm.sh install.sh tests/regression.sh tests/dco-check.sh
          shellcheck -x -S warning spm.sh install.sh tests/regression.sh tests/dco-check.sh
          # The trusted core is Python living inside the shell script; compile
          # it on its own so a syntax error there cannot reach a release
          # disguised as a valid shell heredoc.
          python3 -m compileall -q tests/core-test.py
          python3 - <<'EXTRACT'
          import py_compile, tempfile, os
          body, capturing = [], False
          for line in open("spm.sh", encoding="utf-8"):
              if line.rstrip("\n").endswith("<<'SPMCORE'"):
                  capturing = True
                  continue
              if capturing:
                  if line.rstrip("\n") == "SPMCORE":
                      break
                  body.append(line)
          assert body, "no SPMCORE block found in spm.sh"
          path = os.path.join(tempfile.mkdtemp(), "spm_core.py")
          open(path, "w", encoding="utf-8").writelines(body)
          py_compile.compile(path, doraise=True)
          print("trusted core compiles (%d lines)" % len(body))
          EXTRACT
          # Cheapest gate there is, and it was not being enforced.
          git diff --check "$(git rev-list --max-parents=0 HEAD | tail -n1)"..HEAD

      - name: Disposable-vault regression suite
        run: |
          chmod +x tests/regression.sh
          ./tests/regression.sh

      - name: Release metadata consistency
        run: |
          version="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' spm.sh)"
          test -n "$version"
          grep -q "Current release: \*\*$version\*\*" README.md
          grep -q '"version": "'"$version"'"' browser-extension/manifest.json

  termux:
    name: termux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Run compatibility checks in the official Termux container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            termux/termux-docker@sha256:823c1f4c0b844f6f9f21e634d4e40b6fcc10dcf7309745c4d7de3add9b1a3fd2 \
            bash -lc '
              set -euo pipefail
              cp -R /workspace "$HOME/spm"
              cd "$HOME/spm"
              bash -n spm.sh install.sh tests/regression.sh tests/dco-check.sh
              bash spm.sh help > "$PREFIX/tmp/spm-help.txt"
              grep -q "Sans Password Manager" "$PREFIX/tmp/spm-help.txt"
              version="$(sed -n "s/^VERSION=\"\\([^\"]*\\)\"/\\1/p" spm.sh)"
              bash install.sh --version "$version" \
                --prefix "$HOME/.local" --dry-run > "$PREFIX/tmp/spm-install.txt"
              grep -q "Dry run complete" "$PREFIX/tmp/spm-install.txt"
            '
