name: Bug report
description: Report reproducible incorrect behavior without sharing sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real vaults, passwords, recovery keys, tokens, or screenshots containing secrets.
  - type: input
    id: version
    attributes:
      label: SPM version
      placeholder: "2.11.1"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options: [Interactive CLI, Direct CLI command, Web mode, Import/export, Recovery, Backup/sync, Browser bridge, Installer/update]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bash, GnuPG, OpenSSL, browser, and PM2 versions where relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all real credentials, vault data, keys, tokens, cookies, and private host information.
          required: true
