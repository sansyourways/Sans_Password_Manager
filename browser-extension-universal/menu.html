<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPM accounts</title>
  <style>
    :root{color-scheme:light dark}
    html,body{margin:0;height:100%}
    body{font:13px/1.3 system-ui,sans-serif;background:#1c1c21;color:#f2f2f5;
      border:1px solid #46464f;border-radius:10px;overflow:hidden}
    ul{list-style:none;margin:0;padding:0;height:100%;overflow-y:auto}
    li{display:block}
    button{display:block;width:100%;height:44px;box-sizing:border-box;text-align:left;
      padding:6px 12px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;
      overflow:hidden}
    button:hover,button[aria-selected="true"]{background:#34343d}
    b{display:block;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
    small{display:block;color:#b7b7bf;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
    p{margin:0;padding:12px;color:#b7b7bf}
  </style>
</head>
<body>
  <!--
    Rendered at the extension's own origin inside an iframe the page cannot
    read into. That is the whole reason this is a document rather than a div:
    an injected element, shadow root or not, still lives in the page's
    document, and a page that wants your account list can walk to it.
  -->
  <ul id="accounts" role="listbox" aria-label="Accounts for this site"></ul>
  <script src="menu.js"></script>
</body>
</html>
